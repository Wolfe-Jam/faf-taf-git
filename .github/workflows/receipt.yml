name: TAF Receipt

# A reusable workflow: the receipt job for a workflow whose test job uploaded
# its output as an artifact. Call it from a job with `needs: <test job>` and
# `if: ${{ !cancelled() }}`, and pass `test-result: ${{ needs.<test job>.result }}`,
# so a red run is recorded as FAILED. The calling job must grant
# `permissions: contents: write`; the test job needs no write access. See
# README.md, "Set it up".

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'The artifact the test job uploaded'
        required: true
        type: string
      test-output-file:
        description: 'The file inside the artifact: the test output or a JUnit XML report'
        required: true
        type: string
      target-branch:
        description: 'The branch receipts are saved to'
        required: false
        type: string
        default: taf-receipts
      commit-message:
        description: 'The commit message for each receipt'
        required: false
        type: string
        default: 'chore(taf): update .taf receipt [skip ci]'
      skipped-names:
        description: 'How many skipped test names each receipt carries. 0 turns it off'
        required: false
        type: string
        default: '25'
      test-result:
        description: "The test job's result: needs.<test job>.result. failure is recorded as FAILED even when the output counts no failed test, or when there is no output at all (zero counts); success with no artifact fails this job (a wrong artifact name)"
        required: true
        type: string
      runs-on:
        description: 'The runner for the receipt job'
        required: false
        type: string
        default: ubuntu-latest
    outputs:
      result:
        description: 'Test result (PASSED, FAILED, SKIPPED, IMPROVED, DEGRADED)'
        value: ${{ jobs.receipt.outputs.result }}
      passed:
        description: 'Number of tests passed'
        value: ${{ jobs.receipt.outputs.passed }}
      failed:
        description: 'Number of tests failed'
        value: ${{ jobs.receipt.outputs.failed }}
      total:
        description: 'Total number of tests'
        value: ${{ jobs.receipt.outputs.total }}
      skipped:
        description: 'Number of tests skipped'
        value: ${{ jobs.receipt.outputs.skipped }}
      newly-skipped:
        description: 'Number of tests skipped in this run that were not skipped in the previous receipt'
        value: ${{ jobs.receipt.outputs.newly-skipped }}
      taf-updated:
        description: 'Whether .taf was updated (true/false)'
        value: ${{ jobs.receipt.outputs.taf-updated }}
      receipt-pushed:
        description: 'Whether the receipt reached the remote (true/false)'
        value: ${{ jobs.receipt.outputs.receipt-pushed }}

jobs:
  receipt:
    name: Receipt
    runs-on: ${{ inputs.runs-on }}
    # The only job that writes. A reusable workflow gets no more than its
    # caller grants, so the calling job must grant contents: write too.
    permissions:
      contents: write
    outputs:
      result: ${{ steps.taf.outputs.result }}
      passed: ${{ steps.taf.outputs.passed }}
      failed: ${{ steps.taf.outputs.failed }}
      total: ${{ steps.taf.outputs.total }}
      skipped: ${{ steps.taf.outputs.skipped }}
      newly-skipped: ${{ steps.taf.outputs.newly-skipped }}
      taf-updated: ${{ steps.taf.outputs.taf-updated }}
      receipt-pushed: ${{ steps.taf.outputs.receipt-pushed }}

    steps:
      - uses: actions/checkout@v7

      - name: Download the test output
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/taf-receipt-input

      # No artifact after a test job that passed: the artifact name is wrong,
      # so this job fails. After a failed test job (the build or install failed
      # before the tests, a test did not compile, or the upload was skipped):
      # a placeholder stands in for the output, so the run is still recorded,
      # as FAILED with zero counts.
      - name: No test output
        id: none
        if: steps.download.outcome != 'success'
        env:
          TEST_RESULT: ${{ inputs.test-result }}
          ARTIFACT: ${{ inputs.artifact-name }}
          OUTPUT_FILE: ${{ runner.temp }}/taf-receipt-input/${{ inputs.test-output-file }}
        run: |
          if [ "$TEST_RESULT" = "success" ]; then
            echo "::error::The test job passed but no artifact named '$ARTIFACT' was found. Check artifact-name against the test job's upload step. No receipt was written."
            exit 1
          fi
          if [ "$TEST_RESULT" = "failure" ]; then
            mkdir -p "$(dirname "$OUTPUT_FILE")"
            echo "No test output: the test job failed before its tests reported." > "$OUTPUT_FILE"
            echo "placeholder=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The test job failed and no artifact named '$ARTIFACT' was found: recorded as FAILED with zero counts. Either the tests never reported (the build, the install or a test's compile failed first), or the upload step is missing an if: !cancelled() condition, or the artifact name is wrong."
            exit 0
          fi
          echo "::notice::The test job ended '$TEST_RESULT' and uploaded no test output, so no receipt is written for this run."

      # Pinned to the release this file ships in: a reusable workflow cannot
      # read its own ref. tests/receipt-workflow.test.ts fails when this pin
      # and package.json's version differ.
      - name: Write the receipt
        id: taf
        if: steps.download.outcome == 'success' || steps.none.outputs.placeholder == 'true'
        uses: Wolfe-Jam/taf-git@v3.0.0
        with:
          test-output-file: ${{ runner.temp }}/taf-receipt-input/${{ inputs.test-output-file }}
          auto-commit: 'true'
          commit-message: ${{ inputs.commit-message }}
          target-branch: ${{ inputs.target-branch }}
          skipped-names: ${{ inputs.skipped-names }}
          test-outcome: ${{ inputs.test-result }}
