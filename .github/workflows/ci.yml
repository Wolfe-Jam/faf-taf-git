name: CAR Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  car:
    name: Claim → Audit → Receipt
    runs-on: ubuntu-latest
    # Read-only: the tests never run with write access. Only the receipt job writes.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      # ── C: CLAIM ──────────────────────────────────
      - name: 'C: Validate project.faf (Claim)'
        run: |
          if [ ! -f project.faf ]; then
            echo "::error::No project.faf found. Run 'faf init' to create one."
            exit 1
          fi
          node -e "require('yaml').parse(require('fs').readFileSync('project.faf','utf-8')); console.log('project.faf: valid YAML')"
          echo "Claim validated"

      # ── A: AUDIT ──────────────────────────────────
      - name: Build
        run: npm run build

      - name: No build-machine paths in dist
        run: npm run check:no-hardcode

      - name: 'A: Run tests (Audit)'
        # pipefail: without it `tee` hides jest's exit code and a failing test stays green
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # The receipt job reads this run's output. Uploaded on a failed run too.
      - name: Upload test output
        if: ${{ !cancelled() && hashFiles('test-output.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test-output.txt

  # ── R: RECEIPT ────────────────────────────────
  # The same two-job setup as receipt.yml, but running this commit's Action
  # (uses: ./) so the repo's own CI tests the code it is about to release.
  # receipt.yml pins a released tag, which this repo's CI must not depend on.
  # Runs when the tests failed too (!cancelled()), so a red run on main is
  # recorded as FAILED.
  receipt:
    name: 'R: TAF Receipt'
    needs: car
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the test output
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: test-output
          path: ${{ runner.temp }}/taf-receipt-input

      - name: No test output
        id: none
        if: steps.download.outcome != 'success'
        env:
          TEST_RESULT: ${{ needs.car.result }}
          OUTPUT_FILE: ${{ runner.temp }}/taf-receipt-input/test-output.txt
        run: |
          if [ "$TEST_RESULT" = "success" ]; then
            echo "::error::The test job passed but no test-output artifact was found. No receipt was written."
            exit 1
          fi
          if [ "$TEST_RESULT" = "failure" ]; then
            mkdir -p "$(dirname "$OUTPUT_FILE")"
            echo "No test output: the test job failed before its tests reported." > "$OUTPUT_FILE"
            echo "placeholder=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The test job failed and no test-output artifact was found: recorded as FAILED with zero counts."
            exit 0
          fi
          echo "::notice::The test job ended '$TEST_RESULT' and uploaded no test output, so no receipt is written for this run."

      - name: Write the receipt (this commit's Action)
        if: steps.download.outcome == 'success' || steps.none.outputs.placeholder == 'true'
        uses: ./
        with:
          test-output-file: ${{ runner.temp }}/taf-receipt-input/test-output.txt
          auto-commit: 'true'
          commit-message: 'chore(taf): update receipt [skip ci]'
          target-branch: taf-receipts
          test-outcome: ${{ needs.car.result }}
