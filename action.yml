name: 'TAF — Testing AI Format'
description: 'A Test Receipt Printer for git. Every CI run prints a receipt to .taf — append-only, timestamped, kept in git. Proof over time.'
author: 'wolfejam'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  test-output-file:
    description: 'Path to file containing test output (created by previous step)'
    required: true

  auto-commit:
    description: 'Automatically commit .taf updates (default: true)'
    required: false
    default: 'true'

  commit-message:
    description: 'Custom commit message for .taf updates'
    required: false
    default: 'chore(taf): update .taf receipt [skip ci]'

  target-branch:
    description: 'Push receipts to a dedicated branch (e.g. taf-receipts) instead of the current branch. Branch is created automatically on first run and seeded with existing .taf data.'
    required: false
    default: ''

  skipped-names:
    description: 'How many skipped test names to write on each receipt, with a hash of the full set and what changed since the last receipt. 0 turns it off.'
    required: false
    default: '25'

  fail-on-push-error:
    description: 'Fail the step when the receipt cannot be pushed to the current branch (a read-only token, a protected branch). Off by default: a warning, and receipt-pushed is false. A push another run beat is tried again first, up to 5 times. With target-branch a push that fails after 5 tries always fails the step.'
    required: false
    default: 'false'

  fail-on-failed-tests:
    description: 'Fail the step when the receipt is FAILED (failing tests, or test-outcome: failure), after the receipt is written and pushed and the outputs are set. For a single job whose test step has continue-on-error: true: the red run gets its FAILED receipt and the job still fails. Off by default.'
    required: false
    default: 'false'

  test-outcome:
    description: 'The outcome of your test step or job: steps.<id>.outcome, or needs.<job>.result. Only failure counts (any case): the receipt is FAILED even if the output counts no failed test, and with output that counts nothing at all it is a FAILED receipt with zero counts. A job result is failure when any step of the job failed. Any other value, or left out: the result comes from the output alone.'
    required: false
    default: ''

outputs:
  result:
    description: 'Test result (PASSED, FAILED, SKIPPED, IMPROVED, DEGRADED)'

  passed:
    description: 'Number of tests passed'

  failed:
    description: 'Number of tests failed'

  total:
    description: 'Total number of tests'

  skipped:
    description: 'Number of tests skipped'

  newly-skipped:
    description: 'Number of tests skipped in this run that were not skipped in the previous receipt'

  taf-updated:
    description: 'Whether .taf file was updated (true/false)'

  receipt-pushed:
    description: 'Whether the receipt reached the remote (true/false). false with auto-commit off, with no upstream (a pull request checkout), or when the push failed'

runs:
  using: 'node24'
  main: 'dist/index.js'
